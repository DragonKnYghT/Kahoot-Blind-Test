<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 Blind Test — Hôte</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===================== LOBBY ===================== -->
<section id="lobby">
  <div class="lobby-logo">🎵 Blind Test</div>
  <p style="color:var(--text-muted); margin-bottom:1rem;">Rejoins la partie sur ton téléphone</p>

  <div style="display:flex;flex-direction:column;align-items:center;gap:0.5rem;">
    <div id="qr-container"></div>
    <div style="font-size:0.85rem;color:var(--text-muted);">ou entre le code</div>
    <div class="room-code" id="room-code-display">------</div>
    <div style="font-size:0.8rem;color:var(--text-muted);" id="join-url-display"></div>
  </div>

  <div class="divider"></div>

  <div style="font-size:1rem;color:var(--text-muted);margin-bottom:0.75rem;">
    Joueurs connectés : <span id="player-count">0</span>
  </div>
  <div id="players-grid"></div>

  <div class="mt2">
    <button class="btn btn-primary btn-lg" id="start-btn" disabled onclick="hostStartGame()">
      Lancer la partie ▶
    </button>
    <div style="font-size:0.75rem;color:var(--text-muted);margin-top:0.5rem;">
      Minimum 1 joueur requis
    </div>
  </div>
</section>

<!-- ===================== JEU ===================== -->
<section id="game-screen">
  <div class="song-number" id="song-number">Musique 1 / 3</div>
  <div style="margin-top:0.5rem;font-size:1.2rem;font-weight:600;">Devinez l'artiste et le titre !</div>

  <div id="visualizer-container">
    <canvas id="visualizer"></canvas>
    <div class="audio-status">
      <div class="pulse-dot"></div>
      <span id="audio-status-text">Lecture en cours…</span>
    </div>
  </div>

  <div id="timer-bar-wrap">
    <div id="timer-bar" style="width:100%"></div>
  </div>
  <div style="font-size:0.9rem;color:var(--text-muted);margin-bottom:1rem;">
    ⏱ <span id="timer-display">45</span>s restantes
  </div>

  <div id="answers-live"></div>

  <button class="btn btn-primary mt1" onclick="hostReveal()">Révéler la réponse →</button>
</section>

<!-- ===================== RÉVÉLATION ===================== -->
<section id="reveal-screen">
  <div style="font-size:0.85rem;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:1rem;">
    La réponse était…
  </div>
  <div class="reveal-title" id="reveal-title">—</div>
  <div class="reveal-artist" id="reveal-artist">—</div>

  <div id="reveal-answers"></div>

  <button class="btn btn-primary mt2" id="next-btn" onclick="hostNextSong()">
    Musique suivante →
  </button>
</section>

<!-- ===================== CLASSEMENT FINAL ===================== -->
<section id="final-screen">
  <div class="lobby-logo">🏆 Résultats finaux</div>

  <div class="podium" id="podium"></div>

  <div id="full-leaderboard"></div>

  <button class="btn btn-primary mt2" onclick="location.reload()">Rejouer 🔄</button>
</section>

<!-- QR Code lib -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="songs.js"></script>
<script src="js/game.js"></script>
<script src="js/sync.js"></script>
<script src="js/visualizer.js"></script>
<script src="js/host.js"></script>
</body>
</html>
